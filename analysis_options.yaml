# Kairo — static analysis configuration.
#
# The project targets a clean `flutter analyze` run. Lints are tightened beyond
# `flutter_lints` in the areas that matter most for a long-lived product:
# immutability, disposal, const correctness and readable control flow.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
  errors:
    # Unused code is a defect, not a suggestion.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    # Nudge towards explicit, intentional async handling.
    unawaited_futures: warning
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_returning_null_for_void
    - avoid_unnecessary_containers
    - avoid_void_async
    - await_only_futures
    - camel_case_types
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - empty_catches
    - eol_at_end_of_file
    - implementation_imports
    - library_private_types_in_public_api
    - no_leading_underscores_for_local_identifiers
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes
    - require_trailing_commas
    - sized_box_for_whitespace
    - sort_child_properties_last
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_late
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_build_context_synchronously
    - use_super_parameters
